[build]
  command = "npm run build"          # Lệnh để build ứng dụng
  publish = "build"                  # Thư mục đầu ra sau khi build
[build.environment]
  REACT_APP_API_URL = "https://bkland.onrender.com"
  
# Cấu hình redirects nếu cần (chuyển hướng URL)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
